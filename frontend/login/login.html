<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgriCoop Connect — Connexion</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <!-- =====================================================================
       ÉCRAN DE CONNEXION — TODO (Dev FS1)
       Construire une page de connexion centrée, sobre : logo/titre de
       l'application, formulaire, message d'erreur. Layout : centré
       verticalement et horizontalement, carte de connexion max ~400px de
       large, responsive mobile.

       *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
       ===================================================================== -->
    <main>
      <div class="login-header">
        <div class="logo">
          <img src="../assets/images/Favicon.png" alt="" />
        </div>
        <div class="logo-text">
          <h1>AgriCoop Connect</h1>
          <span>COMAKI — KINTÉLÉ, CONGO</span>
        </div>
      </div>
      <form id="form-login" class="form-login">
        <div class="form-description">
          <h2>Connexion bureau</h2>
          <p>Espace réservé aux membres du bureau COMAKI</p>
          <div id="message-erreur-login" hidden></div>
        </div>
        
        <div class="username-field">
          <label for="l-nom-utilisateur">IDENTIFIANT</label>
          <input
            type="text"
            id="l-nom-utilisateur"
            placeholder="Nom d'utilisateur"
          />
        </div>
        <div class="password-field">
          <label for="l-mot-de-passe">MOT DE PASSE</label>
          <input
            type="password"
            id="l-mot-de-passe"
            placeholder="Mot de passe"
          />
        </div>
        <button type="submit">Se connecter</button>
      </form>
      <p class="demo-infos">
        Démo : identifiant <strong>bureau / comaki2026</strong>
      </p>

      <!-- AIDE — TODO (Dev FS1) : rappel optionnel que les comptes sont créés
         par la Secrétaire (pas d'auto-inscription) -->
    </main>

    <!-- NE PAS MODIFIER — scripts de connexion au backend -->
    <script src="../functions.js"></script>
    <script src="../main.js"></script>
  </body>
</html>
