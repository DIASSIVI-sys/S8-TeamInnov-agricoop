<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriCoop Connect — Membres</title>
  <link rel="stylesheet" href="membres.css">
</head>
<body>

  <!-- ==========================================================
       NAVIGATION — TODO (Dev FS2)
       Pas d'id imposé par main.js ici : structure libre.
       ========================================================== -->

  <main class="app-main">

    <!-- =====================================================================
         ANNUAIRE — vue liste
         ===================================================================== -->
    <section class="page-head">
      <div>
        <h1>Annuaire des Membres</h1>
        <p class="page-subtitle" id="sous-titre-membres">Gérez les profils et suivez les soldes de vos membres actifs.</p>
      </div>
      <button class="btn btn-accent" id="btn-ouvrir-formulaire" type="button">
        Ajouter un membre
      </button>
    </section>

    <!-- =====================================================================
         FILTRES — TODO (Dev FS2)
         Zone de filtrage : sélecteur de statut + recherche par nom.

         *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
         ===================================================================== -->
    <section class="filters-row">
      <label class="search-field" for="champ-recherche-membre">
        <input type="text" id="champ-recherche-membre" placeholder="Rechercher un membre par nom, téléphone…">
      </label>

      <select id="filtre-statut" class="form-select filter-select">
        <option value="">Tous les statuts</option>
        <option value="À jour">À jour</option>
        <option value="En retard">En retard</option>
      </select>
    </section>

    <!-- =====================================================================
         LISTE DES MEMBRES — TODO (Dev FS2)
         Contenu injecté par main.js dans #liste-membres (fonction afficherMembres).

         Structure RÉELLE générée par main.js (confirmée dans le code) : -->
       
         <!-- Si aucun membre : main.js écrit directement "Aucun membre trouvé."
         dans #liste-membres (pas de zone séparée à gérer).

         *** NE PAS MODIFIER l'id ci-dessous — main.js l'utilise ***
         ===================================================================== -->
    <div id="liste-membres" class="membres-grid" aria-live="polite"></div>

       <!-- =====================================================================
         NOUVEAU MEMBRE — TODO (Dev FS2)
         Formulaire de création (FRD section 4.1). Les 4 champs sont obligatoires.
         Village = menu déroulant fermé, rempli par main.js.

         *** NE PAS MODIFIER les id ci-dessous — main.js les utilise ***
         ===================================================================== -->
    <section class="add-member-section hidden" id="section-nouveau-membre">
      <div class="add-member-form card">
        <div class="add-member-form-head">
          <div>
            <h2>Ajouter un membre</h2>
            <p class="text-muted">Remplissez les informations ci-dessous pour enregistrer un nouveau producteur dans la coopérative.</p>
          </div>
        </div>

        <hr class="form-divider">

        <div id="erreurs-nouveau-membre" class="alert alert-error" hidden></div>
        <div id="message-succes-nouveau-membre" class="alert alert-success" hidden></div>

        <form id="form-nouveau-membre">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="nm-prenom">Prénom</label>
              <div class="input-icon-wrap">
                <input type="text" id="nm-prenom" class="form-input" placeholder="Ex : Jean" required>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" for="nm-nom">Nom</label>
              <div class="input-icon-wrap">
                <input type="text" id="nm-nom" class="form-input" placeholder="Ex : Mukoko" required>
              </div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label class="form-label" for="nm-village">Localité / Village</label>
              <div class="input-icon-wrap">
                <!-- Rempli dynamiquement par main.js (fetch /villages) -->
                <select id="nm-village" class="form-input form-input-select" required>
                  <option value="">-- Choisir un village --</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label" for="nm-contact">Numéro de téléphone</label>
              <div class="input-icon-wrap">
                <input type="text" id="nm-contact" class="form-input" placeholder="+242 06 XXX XX XX" required>
              </div>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">
              Enregistrer le membre
            </button>
            <button type="button" class="btn btn-secondary" id="btn-annuler-membre">Annuler</button>
          </div>
        </form>
      </div>
    </section>

  </main>

  <!-- ==========================================================
       Djena, Gédéon, Clarine, ceci est un petit script d'interface, purement cosmétique :
       - bascule l'affichage de la section "Ajouter un membre"
       - met à jour le compteur de l'aperçu et le sous-titre
       Ne remplace ni ne modifie functions.js / main.js.
       ========================================================== -->
  

  <!-- NE PAS MODIFIER — scripts de connexion au backend -->
  <script src="../functions.js"></script>
  <script src="../main.js"></script>
  <script src="/frontend/ajouter_membre.js"></script>
</body>
</html>
