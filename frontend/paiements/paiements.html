  <main>
    <div class="entete-paiements">
  <h1>Paiements</h1>
  <label for="toggle-form-paiement" class="btn-nouveau-paiement">+ Nouveau paiement</label>
</div>

<input type="checkbox" id="toggle-form-paiement" class="toggle-form">

<!-- fond semi-transparent, cliquable pour fermer le modal -->
<label for="toggle-form-paiement" class="overlay-fond"></label>

<div class="conteneur-form-paiement">
  <form id="form-paiement">
    <div class="champ-form">
      <label for="p-membre">Membre</label>
      <select id="p-membre">
        <option value="">-- Choisir un membre --</option>
      </select>
    </div>

    <div class="champ-form">
      <label for="p-montant">Montant (FCFA)</label>
      <input type="number" id="p-montant" min="1" placeholder="Montant (FCFA)">
    </div>

    <div class="champ-form">
      <label for="p-mode-paiement">Mode de paiement</label>
      <select id="p-mode-paiement">
        <option value="">-- Mode de paiement --</option>
        <option value="Espèces">Espèces</option>
        <option value="Mobile Money">Mobile Money</option>
      </select>
    </div>

    <button type="submit">Enregistrer</button>
  </form>
</div>

    <div id="message-erreur-paiement" hidden></div>
    <div id="message-succes-paiement" hidden></div>

    <!-- =====================================================================

    <!--<div id="total-paiements"></div>-->
    <h2 class="titre-section">Historique des paiements</h2>

       <div class="carte-tableau-scroll">
    <table>
      <thead>
        <!-- TODO (Dev FS4) : en-têtes (Membre, Montant, Mode de paiement, Date) -->

          <th>Membre</th>
          <th>Montant</th>
          <th>Mode de paiement</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="liste-paiements"></tbody>
    </table>
    </div>
    </div>
